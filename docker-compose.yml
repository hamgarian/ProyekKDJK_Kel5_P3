# GitLab CE - deployment untuk projek KDJK, jalur CLI docker compose.
#
# Image: resmi gitlab/gitlab-ce (Docker Hub), tag di-pin ke 19.5.1-ce.0.
# Dukungan arm64 tag ini diverifikasi lewat registry manifest
# (lihat scripts/validate.sh dan bagian "Arsitektur Host" di README.md).
#
# Berkas ini memakai bind mount ./srv/gitlab dan mem-bind HTTP ke 127.0.0.1,
# jadi reverse proxy di host yang mengekspos instance ke publik.
# Instance aktif gitlab.ilhem.eu.org dijalankan lewat Coolify dengan definisi
# yang tersalin di compose.coolify.yaml.

services:
  gitlab:
    # Digest index multi-arch 19.5.1-ce.0 yang diverifikasi:
    #   sha256:bb79dc86267c557fd11e7feb0cd9dd506dd02e991ecdd6cae11ca7d7e5d36fc3
    #   -> child linux/amd64 sha256:939572df24c6517d0408d7355cafef3f7c6defa9d248201151a88361fc411242
    #   -> child linux/arm64 sha256:a8adb207a2caeb0bc28d43b3fdfc4963584e8b166dfbc941d0aa9b098e95efe8
    image: gitlab/gitlab-ce:19.5.1-ce.0
    container_name: gitlab
    restart: always
    hostname: '${GITLAB_HOST:?set GITLAB_HOST di .env}'
    shm_size: '256m'

    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # --- URL eksternal -------------------------------------------------
        # TLS diterminasi oleh reverse proxy di depan container, sehingga
        # external_url memakai https:// tetapi nginx internal tetap HTTP.
        external_url '${GITLAB_EXTERNAL_URL:?set GITLAB_EXTERNAL_URL di .env}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          'X-Forwarded-Proto' => 'https',
          'X-Forwarded-Ssl'   => 'on'
        }
        letsencrypt['enable'] = false

        # Port SSH yang diiklankan di URL clone (lihat mapping ports: di bawah).
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # --- Penghematan memori -------------------------------------------
        # Sumber: https://docs.gitlab.com/omnibus/settings/memory_constrained_envs/
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
        gitlab_rails['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
        }
        gitaly['configuration'] = {
          concurrency: [
            {
              'rpc' => "/gitaly.SmartHTTPService/PostReceivePack",
              'max_per_repo' => 3,
            }, {
              'rpc' => "/gitaly.SSHService/SSHUploadPack",
              'max_per_repo' => 3,
            },
          ],
        }
        gitaly['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
          'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
        }

        # --- Batas upload --------------------------------------------------
        gitlab_rails['max_attachment_size'] = ${GITLAB_MAX_ATTACHMENT_MB:-50}
        nginx['client_max_body_size'] = '${GITLAB_MAX_BODY_SIZE:-50m}'

        # --- Backup --------------------------------------------------------
        gitlab_rails['manage_backup_path'] = true
        gitlab_rails['backup_path'] = '/var/opt/gitlab/backups'
        gitlab_rails['backup_keep_time'] = ${GITLAB_BACKUP_KEEP_TIME:-604800}

    ports:
      # Hanya di-bind ke loopback: reverse proxy di host yang mengekspos ke publik.
      - '127.0.0.1:${GITLAB_HTTP_PORT:-8929}:80'
      # SSH untuk git clone harus dijangkau langsung dari internet.
      - '${GITLAB_SSH_PORT:-2222}:22'

    volumes:
      - './srv/gitlab/config:/etc/gitlab'
      - './srv/gitlab/logs:/var/log/gitlab'
      - './srv/gitlab/data:/var/opt/gitlab'

    # GitLab butuh waktu boot yang lama (first boot bisa >10 menit di ARM64 2 vCPU).
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 15m
